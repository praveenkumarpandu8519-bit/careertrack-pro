name: Update CareerTrack Pro Jobs
'on':
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect available jobs
        working-directory: CareerTrackPro_Free_Automatic
        run: python collector/collect_jobs.py

      - name: Save updated job list
        working-directory: CareerTrackPro_Free_Automatic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update job listings"
          git push
